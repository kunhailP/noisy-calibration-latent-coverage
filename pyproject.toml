[project]
name = "latentcov"
version = "0.1.0.dev0"
description = "Latent coverage from noisy calibration: ranks, certificates and experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "python-flint>=0.6",
    "mpmath>=1.3",
    "rdata>=0.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
